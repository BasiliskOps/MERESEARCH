[project]
name = "meresearch"
version = "0.1.0"
description = "Monitor Ensemble Study: state-augmented monitoring architecture evaluated on SLEIGHT-Bench at 1% FPR"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Lastelle AI" }]
dependencies = [
    "anthropic>=0.96",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "cryptography>=42.0",
    "typer>=0.15",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
meresearch = "meresearch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "bandit>=1.8",
    "pre-commit>=4.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meresearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["ext"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "ext", ".venv"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
